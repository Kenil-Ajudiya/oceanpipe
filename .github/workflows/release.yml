name: Publish to PyPI

on:
  release:
    types: [published]  # Triggers only when you officially publish a GitHub Release

jobs:
  pypi-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest
    
    # Mandatory environment block matching PyPI Trusted Publisher standards
    environment:
      name: pypi
      url: https://pypi.org/project/oceanpipe/
      
    permissions:
      id-token: write  # Crucial: Allows GitHub to securely request a temporary PyPI token
      contents: read   # Allows checking out the source code

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build Package Artifacts
        run: hatch build

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
