<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    
    <!-- Wave / Radio Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="190" rx="16" fill="url(#bgGrad)" />

  <!-- Graphic Icon Group (Left Side) -->
  <g transform="translate(80, 95)">
    <!-- Concentric Radio/Ocean Waves -->
    <path d="M -40 20 Q 0 -20 40 20" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M -30 30 Q 0 -10 30 30" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M -20 40 Q 0 0 20 40" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Central Pulsing Transient Star / Beacon -->
    <circle cx="0" cy="-25" r="6" fill="#38bdf8" filter="url(#glow)" />
    <path d="M 0 -45 L 0 -5 M -20 -25 L 20 -25" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography (Right Side) -->
  <!-- Main Title -->
  <text x="160" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#f8fafc" letter-spacing="1">
    ocean<tspan fill="#38bdf8">pipe</tspan>
  </text>
  
  <!-- Subtitle Line 1 -->
  <text x="163" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="0.5">
    Scouring the MWA Archive for
  </text>

  <!-- Subtitle Line 2 (Highlighting OCEAN) -->
  <text x="163" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#cbd5e1" letter-spacing="0.5">
    <tspan fill="#38bdf8" font-weight="800">O</tspan>utbursts of <tspan fill="#38bdf8" font-weight="800">C</tspan>oherent <tspan fill="#38bdf8" font-weight="800">E</tspan>mission <tspan fill="#38bdf8" font-weight="800">A</tspan>midst <tspan fill="#38bdf8" font-weight="800">N</tspan>oise
  </text>
</svg>
