<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="waveGradSq" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowSq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Background with Rounded Corners -->
  <rect width="500" height="500" rx="40" fill="url(#bgGradSq)" />

  <!-- Graphic Icon (Top Center) -->
  <g transform="translate(250, 140)">
    <path d="M -50 25 Q 0 -25 50 25" fill="none" stroke="url(#waveGradSq)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M -38 38 Q 0 -12 38 38" fill="none" stroke="url(#waveGradSq)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M -25 50 Q 0 0 25 50" fill="none" stroke="url(#waveGradSq)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowSq)"/>
    
    <circle cx="0" cy="-30" r="7" fill="#38bdf8" filter="url(#glowSq)" />
    <path d="M 0 -55 L 0 -5 M -25 -30 L 25 -30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Typography (Centered) -->
  <text x="250" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="1.5">
    ocean<tspan fill="#38bdf8">pipe</tspan>
  </text>
  
  <text x="250" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="0.8">
    Scouring the MWA Archive for
  </text>

  <text x="250" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13.5" fill="#cbd5e1" letter-spacing="0.5">
    <tspan fill="#38bdf8" font-weight="800">O</tspan>utbursts of <tspan fill="#38bdf8" font-weight="800">C</tspan>oherent <tspan fill="#38bdf8" font-weight="800">E</tspan>mission <tspan fill="#38bdf8" font-weight="800">A</tspan>midst <tspan fill="#38bdf8" font-weight="800">N</tspan>oise
  </text>
</svg>
