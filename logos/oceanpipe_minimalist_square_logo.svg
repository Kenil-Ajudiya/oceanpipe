<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSqMin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="waveGradSqMin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowSqMin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Background with Rounded Corners -->
  <rect width="500" height="500" rx="40" fill="url(#bgGradSqMin)" />

  <!-- Graphic Icon (Centered Top) -->
  <g transform="translate(250, 190)">
    <path d="M -55 25 Q 0 -25 55 25" fill="none" stroke="url(#waveGradSqMin)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M -42 38 Q 0 -12 42 38" fill="none" stroke="url(#waveGradSqMin)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M -28 50 Q 0 0 28 50" fill="none" stroke="url(#waveGradSqMin)" stroke-width="5" stroke-linecap="round" filter="url(#glowSqMin)"/>
    
    <circle cx="0" cy="-32" r="8" fill="#38bdf8" filter="url(#glowSqMin)" />
    <path d="M 0 -58 L 0 -6 M -28 -32 L 28 -32" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Typography (Centered Below Icon) -->
  <text x="250" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#f8fafc" letter-spacing="1.5">
    ocean<tspan fill="#38bdf8">pipe</tspan>
  </text>
</svg>
