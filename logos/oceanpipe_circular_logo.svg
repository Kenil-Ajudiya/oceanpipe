<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCirc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="waveGradCirc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowCirc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Circular Mask -->
    <clipPath id="circleMask">
      <circle cx="250" cy="250" r="250" />
    </clipPath>
  </defs>

  <!-- Circular Background Container -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGradCirc)" />

  <!-- Clipped Content Group to ensure absolute circular bounds -->
  <g clip-path="url(#circleMask)">
    <!-- Graphic Icon (Top Center) -->
    <g transform="translate(250, 135)">
      <path d="M -45 22 Q 0 -22 45 22" fill="none" stroke="url(#waveGradCirc)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M -34 33 Q 0 -11 34 33" fill="none" stroke="url(#waveGradCirc)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M -22 44 Q 0 0 22 44" fill="none" stroke="url(#waveGradCirc)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowCirc)"/>
      
      <circle cx="0" cy="-28" r="6.5" fill="#38bdf8" filter="url(#glowCirc)" />
      <path d="M 0 -50 L 0 -6 M -22 -28 L 22 -28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Typography (Slightly tighter layout to fit safe zone inside circle) -->
    <text x="250" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#f8fafc" letter-spacing="1.5">
      ocean<tspan fill="#38bdf8">pipe</tspan>
    </text>
    
    <text x="250" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="0.8">
      Scouring the MWA Archive for
    </text>

    <text x="250" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#cbd5e1" letter-spacing="0.4">
      <tspan fill="#38bdf8" font-weight="800">O</tspan>utbursts of <tspan fill="#38bdf8" font-weight="800">C</tspan>oherent <tspan fill="#38bdf8" font-weight="800">E</tspan>mission <tspan fill="#38bdf8" font-weight="800">A</tspan>midst <tspan fill="#38bdf8" font-weight="800">N</tspan>oise
    </text>
  </g>
</svg>
