[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oceanpipe"
dynamic = ["version"]
description = "A pipeline to scour the MWA Archive for Outbursts of Coherent Emission Amidst Noise."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["LPTs", "MWA", "Radio Astronomy", "Transient Search"]
authors = [{ name = "Kenil Ajudiya", email = "k.ajudiya@postgrad.curtin.edu.au" }]
maintainers = [{ name = "Kenil Ajudiya", email = "k.ajudiya@postgrad.curtin.edu.au" }]
classifiers = [ # Full list of classifiers: https://pypi.org/classifiers/
    "Development Status :: 1 - Planning",

    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",

    "License :: OSI Approved :: MIT License",

    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["click"]

urls.Documentation = "https://github.com/Kenil-Ajudiya/oceanpipe#readme"
urls.Issues = "https://github.com/Kenil-Ajudiya/oceanpipe/issues"
urls.Source = "https://github.com/Kenil-Ajudiya/oceanpipe"

scripts.ocean = "ocean.cli:ocean" # Define the command-line interface entry point

# Coverage configuration
[tool.coverage]
run.source_pkgs = ["ocean", "tests"]
run.branch = true
run.parallel = true
run.omit = ["src/ocean/__about__.py"]

paths.ocean = ["src/ocean", "*/ocean/src/ocean"]
paths.tests = ["tests", "*/ocean/tests"]

report.exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

# Hatch configuration
[tool.hatch]
version.source = "vcs"

build.hooks.vcs.version-file = "src/ocean/_version.py"
build.include = [
    "src/ocean/**",
    "README.md",
    "LICENSE",
]
build.targets.wheel.packages = ["src/ocean"]

envs.types.extra-dependencies = ["mypy>=1.0.0"]
envs.types.scripts.check = "mypy --install-types --non-interactive {args:src/ocean tests}"

publish.index.repos.test = "https://test.pypi.org/project/oceanpipe/"
publish.index.repos.main = "https://upload.pypi.org/project/oceanpipe/"
